name: Deploy Library to NPM

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
  push:
    branches:
      - master

permissions:
  contents: write
  id-token: write
  issues: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, 'ci skip') && !contains(github.event.head_commit.message, 'skip ci')"
    steps:
      - name: checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: download + setup auto
        uses: auto-it/setup-auto@v1

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Use Node.js 24.11.1
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml

      - name: Use Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install font build tools
        run: pip install -r requirements-font.txt

      - name: Install xmllint
        run: |
          sudo apt-get update
          sudo apt-get install -y libxml2-utils

      - name: Build
        env:
          NPM_TOKEN: ${{ secrets.INFINEON_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          pnpm install --frozen-lockfile
          pnpm run test:font-normalization
          pnpm run build

      - name: Commit changes
        if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
        env:
          BRANCH_NAME: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}
        run: |
          if [[ -z "$(git status --porcelain)" ]]; then
            echo "No changes to commit."
          else
            echo "Committing changes"
            git config user.name "github-actions"
            git config user.email "github-actions@github.com"
            git add .
            git commit -m "Updated glyphmap"
            git push origin HEAD:$BRANCH_NAME
          fi

      - name: Set npm registry
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          registry-url: "https://registry.npmjs.org"

      - name: Publish canonical package with Auto
        id: canonical
        if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_CHANNEL: ${{ github.event_name == 'push' && 'latest' || 'canary' }}
        run: |
          before=$(jq -r .version package.json)
          if [[ "$RELEASE_CHANNEL" == canary ]]; then
            pnpm exec auto canary --force
          else
            pnpm exec auto shipit
          fi
          after=$(jq -r .version package.json)
          if [[ "$after" == "$before" ]]; then
            echo "Auto selected no release; skipping the legacy publication."
            exit 0
          fi
          echo "Published canonical version: $after ($RELEASE_CHANNEL)"
          echo "published=true" >> "$GITHUB_OUTPUT"

      - name: Publish legacy package
        if: steps.canonical.outputs.published == 'true'
        env:
          RELEASE_TAG: ${{ github.event_name == 'push' && 'latest' || 'canary' }}
        run: |
          jq '
            .name = "@infineon/infineon-icons"
            | .deprecated = "This package has moved to @infineon/design-system-icons. It remains supported during the migration period; use the new name when migrating."
          ' package.json > package.legacy.json
          mv package.legacy.json package.json
          npm publish --access public --tag "$RELEASE_TAG"
